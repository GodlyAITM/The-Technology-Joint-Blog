name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          # Optional: base URL of the Studio team-login API (e.g. a Vercel
          # deployment of studio-api/). When set, the Studio uses shared-token
          # username/password accounts instead of per-device personal access
          # tokens. Set PUBLIC_STUDIO_AUTH_MODE=oauth to keep the GitHub OAuth
          # worker flow instead. The public site must always build without it.
          PUBLIC_STUDIO_API_URL: ${{ vars.PUBLIC_STUDIO_API_URL }}
          PUBLIC_STUDIO_AUTH_MODE: ${{ vars.PUBLIC_STUDIO_AUTH_MODE }}
          # Optional: Simple Analytics hostname (e.g. godlyaitm.github.io).
          # Loads the analytics script and enables the studio traffic panel.
          PUBLIC_ANALYTICS_DOMAIN: ${{ vars.PUBLIC_ANALYTICS_DOMAIN }}

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
